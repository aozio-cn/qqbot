<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - QQBot 管理平台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <h1>QQBot 管理</h1>
      <p>多机器人统一管理平台</p>
    </div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" value="admin" placeholder="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
    <div class="alert alert-error" id="error" style="display:none;margin-top:12px;"></div>
  </div>
</div>
<script src="/login.js"></script>
</body>
</html>
